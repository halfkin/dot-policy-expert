<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dot | Loomo Policy Expert</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #f4f1ec;
      --bg-chat: #ffffff;
      --bg-user-msg: #1a1a2e;
      --bg-bot-msg: #f7f6f3;
      --bg-blocked: #fff0f0;
      --bg-conflict: #fef8ee;
      --accent: #e05a33;
      --accent-soft: #f0886a;
      --accent-bg: rgba(224, 90, 51, 0.08);
      --text-primary: #1a1a2e;
      --text-secondary: #6b6b7b;
      --text-light: #9b9baa;
      --text-on-dark: #f0eeeb;
      --text-citation: #c04a25;
      --border: #e8e6e1;
      --border-focus: #e05a33;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 22px;
      --radius-pill: 999px;
      --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'IBM Plex Mono', 'Menlo', monospace;
      --shadow-sm: 0 1px 3px rgba(26, 26, 46, 0.06);
      --shadow-md: 0 8px 30px rgba(26, 26, 46, 0.08);
      --shadow-lg: 0 20px 60px rgba(26, 26, 46, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--text-primary);
      background: var(--bg-page);
      background-image:
        radial-gradient(ellipse 900px 500px at 10% 0%, rgba(224, 90, 51, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse 800px 400px at 90% 100%, rgba(26, 26, 46, 0.04) 0%, transparent 60%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* ─── App Shell ─── */
    .app {
      width: min(920px, 100%);
      height: min(94vh, 920px);
      background: var(--bg-chat);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg), 0 0 0 1px rgba(0,0,0,0.04);
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }

    /* ─── Header ─── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 22px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-chat);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-avatar {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      color: #fff;
      letter-spacing: -0.02em;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(224, 90, 51, 0.3);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 0.78rem;
      color: var(--text-light);
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mode {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      border-radius: var(--radius-pill);
      padding: 5px 12px;
      text-transform: uppercase;
    }

    .mode.mode-llm {
      color: #1a6b3c;
      background: #e8f5ee;
    }

    .mode.mode-offline {
      color: var(--text-secondary);
      background: #f0efec;
    }

    .clear-btn {
      border: 1px solid var(--border);
      background: var(--bg-chat);
      color: var(--text-secondary);
      border-radius: var(--radius-pill);
      padding: 5px 14px;
      font-size: 0.78rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 150ms ease;
    }

    .clear-btn:hover {
      border-color: var(--text-secondary);
      color: var(--text-primary);
    }

    /* ─── Chat Log ─── */
    .chat-log {
      overflow-y: auto;
      padding: 24px 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .chat-log::-webkit-scrollbar { width: 6px; }
    .chat-log::-webkit-scrollbar-track { background: transparent; }
    .chat-log::-webkit-scrollbar-thumb { background: #d4d2cd; border-radius: 3px; }

    /* ─── Messages ─── */
    .message {
      display: flex;
      width: 100%;
      animation: slideIn 280ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .message.user { justify-content: flex-end; }
    .message.bot { justify-content: flex-start; }

    .bubble {
      max-width: min(78%, 660px);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      line-height: 1.5;
    }

    .message.user .bubble {
      background: var(--bg-user-msg);
      color: var(--text-on-dark);
      border-radius: var(--radius-md) var(--radius-md) 4px var(--radius-md);
      box-shadow: var(--shadow-sm);
    }

    .message.bot .bubble {
      background: var(--bg-bot-msg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md) var(--radius-md) var(--radius-md) 4px;
      box-shadow: var(--shadow-sm);
    }

    .bubble.blocked {
      background: var(--bg-blocked);
      border-color: #f0d0d0;
    }

    .bubble.conflict {
      background: var(--bg-conflict);
      border-color: #f0dfbc;
    }

    /* ─── Message Meta ─── */
    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sender {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .message.user .sender { color: var(--text-on-dark); opacity: 0.7; }

    .badge {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      border-radius: var(--radius-pill);
      padding: 3px 9px;
    }

    .badge-neutral { color: var(--text-secondary); background: #eeedea; }
    .badge-blocked { color: #9a2020; background: #fde0e0; }
    .badge-conflict { color: #8a5a08; background: #faecc8; }

    /* ─── Body ─── */
    .bubble-body {
      white-space: pre-wrap;
      font-size: 0.92rem;
      line-height: 1.55;
      color: var(--text-primary);
    }

    .message.user .bubble-body { color: var(--text-on-dark); }

    /* ─── Citations ─── */
    details.citations {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: #fff;
      padding: 10px 12px;
      transition: background 150ms ease;
    }

    details.citations[open] {
      background: #fdfcfa;
    }

    details.citations summary {
      cursor: pointer;
      color: var(--text-citation);
      font-size: 0.8rem;
      font-weight: 600;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    details.citations summary::before {
      content: "›";
      font-size: 1rem;
      font-weight: 700;
      transition: transform 200ms ease;
      display: inline-block;
    }

    details.citations[open] summary::before {
      transform: rotate(90deg);
    }

    details.citations summary::-webkit-details-marker { display: none; }

    .citation-item {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #eeece7;
      font-size: 0.82rem;
    }

    .citation-id {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-citation);
      margin-bottom: 4px;
      font-weight: 500;
    }

    .citation-quote {
      color: var(--text-secondary);
      font-style: italic;
      line-height: 1.5;
    }

    /* ─── Response Footer ─── */
    .response-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-size: 0.75rem;
      color: var(--text-light);
      padding-top: 4px;
    }

    .confidence {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 500;
    }

    .confidence-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .confidence-high .confidence-dot { background: #2f9e44; }
    .confidence-medium .confidence-dot { background: #d4a017; }
    .confidence-low .confidence-dot { background: #e06833; }

    .feedback-row {
      display: inline-flex;
      gap: 4px;
      margin-left: auto;
    }

    .feedback-btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text-light);
      border-radius: var(--radius-pill);
      padding: 3px 9px;
      font-size: 0.78rem;
      line-height: 1;
      cursor: pointer;
      transition: all 120ms ease;
    }

    .feedback-btn:hover:not(:disabled) {
      border-color: var(--accent-soft);
      color: var(--accent);
      background: var(--accent-bg);
    }

    .feedback-btn.selected {
      border-color: var(--accent);
      background: var(--accent-bg);
      color: var(--accent);
    }

    .feedback-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ─── Suggestions ─── */
    .suggestions {
      margin-top: 4px;
      border-top: 1px dashed var(--border);
      padding-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .suggestions-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 2px;
    }

    .suggestion-item {
      border: none;
      background: transparent;
      color: var(--text-citation);
      text-align: left;
      padding: 4px 0;
      cursor: pointer;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      transition: color 100ms ease;
    }

    .suggestion-item:hover {
      color: var(--accent);
    }

    /* ─── Conflict View ─── */
    .conflict-box {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: stretch;
      border: 1px solid #ebd5a7;
      border-radius: var(--radius-sm);
      background: #fffbf4;
      padding: 12px;
    }

    .conflict-source {
      border: 1px solid #f1e0bc;
      background: #fff;
      border-radius: var(--radius-sm);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .conflict-source .src-id {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: #946100;
      font-weight: 500;
    }

    .conflict-source .facts {
      font-size: 0.8rem;
      color: #6e5225;
    }

    .conflict-vs {
      align-self: center;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      color: #b07a18;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    /* ─── Composer ─── */
    .composer {
      border-top: 1px solid var(--border);
      padding: 14px 18px;
      background: var(--bg-chat);
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .input-wrap {
      flex: 1;
      position: relative;
    }

    .input-wrap textarea {
      width: 100%;
      resize: none;
      min-height: 48px;
      max-height: 140px;
      padding: 13px 16px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      font-family: inherit;
      font-size: 0.92rem;
      color: var(--text-primary);
      line-height: 1.4;
      background: #fafaf8;
      transition: all 180ms ease;
    }

    .input-wrap textarea::placeholder {
      color: var(--text-light);
    }

    .input-wrap textarea:focus {
      outline: none;
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(224, 90, 51, 0.1);
    }

    .send-btn {
      height: 48px;
      width: 48px;
      border: none;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: all 150ms ease;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(224, 90, 51, 0.25);
    }

    .send-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .send-btn:hover {
      background: #c94e2b;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(224, 90, 51, 0.35);
    }

    .send-btn:active { transform: translateY(0); }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .hint {
      width: 100%;
      padding: 0 4px;
      margin-top: -4px;
      margin-bottom: -4px;
      font-size: 0.7rem;
      color: var(--text-light);
    }

    /* ─── Loading ─── */
    .loading-dots {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }

    .loading-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-soft);
      animation: pulse 1s infinite ease-in-out;
    }

    .loading-dots span:nth-child(2) { animation-delay: 150ms; }
    .loading-dots span:nth-child(3) { animation-delay: 300ms; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.1); }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ─── Responsive ─── */
    @media (max-width: 700px) {
      body { padding: 0; }
      .app {
        height: 100vh;
        height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
      .bubble { max-width: 88%; }
      .conflict-box {
        grid-template-columns: 1fr;
      }
      .conflict-vs { justify-self: center; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-avatar">D</div>
        <div class="brand-text">
          <h1 class="brand-title">Dot</h1>
          <p class="brand-subtitle">Loomo Policy Expert</p>
        </div>
      </div>
      <div class="header-right">
        <span class="mode" id="mode-badge">Loading...</span>
        <button class="clear-btn" id="clear-btn" type="button">Clear chat</button>
      </div>
    </header>

    <main class="chat-log" id="chat-log"></main>

    <footer>
      <form class="composer" id="composer-form">
        <div class="input-wrap">
          <textarea id="question-input" rows="1" placeholder="Ask about Loomo policies..." aria-label="Ask a question"></textarea>
        </div>
        <button class="send-btn" id="send-btn" type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
        </button>
      </form>
      <p class="hint" style="padding: 0 22px 10px;">Press Enter to send · Shift+Enter for newline</p>
    </footer>
  </div>

  <script>
    const chatLogEl = document.getElementById("chat-log");
    const formEl = document.getElementById("composer-form");
    const inputEl = document.getElementById("question-input");
    const sendBtnEl = document.getElementById("send-btn");
    const clearBtnEl = document.getElementById("clear-btn");
    const modeBadgeEl = document.getElementById("mode-badge");
    let conversationHistory = [];

    /* Auto-resize textarea */
    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
    });

    const statusMap = {
      not_in_sources: { label: "Not in sources", badgeClass: "badge-neutral", bubbleClass: "" },
      prompt_injection_blocked: { label: "Blocked", badgeClass: "badge-blocked", bubbleClass: "blocked" },
      conflict_in_sources: { label: "Conflict", badgeClass: "badge-conflict", bubbleClass: "conflict" },
      unsupported_language: { label: "Unsupported language", badgeClass: "badge-neutral", bubbleClass: "" },
      empty_input: { label: "Empty input", badgeClass: "badge-neutral", bubbleClass: "" },
      input_too_long: { label: "Input too long", badgeClass: "badge-neutral", bubbleClass: "" },
      rate_limited: { label: "Rate limited", badgeClass: "badge-neutral", bubbleClass: "" },
      needs_clarification: { label: "Needs clarification", badgeClass: "badge-neutral", bubbleClass: "" },
      retrieval_failed: { label: "System issue", badgeClass: "badge-neutral", bubbleClass: "" },
    };

    const confidenceLabelMap = {
      high: "High confidence",
      medium: "Medium confidence",
      low: "Low confidence — consider verifying",
    };

    function escapeHtml(text) {
      return (text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function autoScroll() {
      chatLogEl.scrollTop = chatLogEl.scrollHeight;
    }

    function buildCitations(citations) {
      const details = document.createElement("details");
      details.className = "citations";
      const summary = document.createElement("summary");
      summary.textContent = `${citations.length} source${citations.length !== 1 ? "s" : ""} cited`;
      details.appendChild(summary);

      citations.forEach((c) => {
        const item = document.createElement("div");
        item.className = "citation-item";

        const id = document.createElement("div");
        id.className = "citation-id";
        id.textContent = `${c.doc_id} › ${c.chunk_id}`;

        const quote = document.createElement("p");
        quote.className = "citation-quote";
        quote.textContent = `"${c.quote}"`;

        item.appendChild(id);
        item.appendChild(quote);
        details.appendChild(item);
      });

      return details;
    }

    function buildConflictView(conflictDetails) {
      if (!conflictDetails || !Array.isArray(conflictDetails.sources) || conflictDetails.sources.length < 2) {
        return null;
      }

      const box = document.createElement("div");
      box.className = "conflict-box";

      const left = conflictDetails.sources[0];
      const right = conflictDetails.sources[1];

      const leftEl = document.createElement("div");
      leftEl.className = "conflict-source";
      leftEl.innerHTML = `
        <div class="src-id">${escapeHtml(left.doc_id)} › ${escapeHtml(left.chunk_id)}</div>
        <div class="facts">Values: ${escapeHtml((left.facts || []).join(", ") || "n/a")}</div>
      `;

      const vsEl = document.createElement("div");
      vsEl.className = "conflict-vs";
      vsEl.textContent = "vs";

      const rightEl = document.createElement("div");
      rightEl.className = "conflict-source";
      rightEl.innerHTML = `
        <div class="src-id">${escapeHtml(right.doc_id)} › ${escapeHtml(right.chunk_id)}</div>
        <div class="facts">Values: ${escapeHtml((right.facts || []).join(", ") || "n/a")}</div>
      `;

      box.appendChild(leftEl);
      box.appendChild(vsEl);
      box.appendChild(rightEl);

      return box;
    }

    function buildSuggestions(suggestions) {
      const container = document.createElement("div");
      container.className = "suggestions";

      const title = document.createElement("p");
      title.className = "suggestions-title";
      title.textContent = "You might be looking for:";
      container.appendChild(title);

      suggestions.forEach((s) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "suggestion-item";
        button.textContent = `→ ${s.heading}`;
        button.addEventListener("click", () => sendQuestion(s.heading));
        container.appendChild(button);
      });

      return container;
    }

    async function postFeedback(payload) {
      try {
        await fetch("/feedback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
      } catch (error) {
        console.error("Feedback log failed", error);
      }
    }

    function buildFeedbackControls(options) {
      const row = document.createElement("div");
      row.className = "feedback-row";

      const upBtn = document.createElement("button");
      upBtn.type = "button";
      upBtn.className = "feedback-btn";
      upBtn.textContent = "👍";

      const downBtn = document.createElement("button");
      downBtn.type = "button";
      downBtn.className = "feedback-btn";
      downBtn.textContent = "👎";

      const lockButtons = () => {
        upBtn.disabled = true;
        downBtn.disabled = true;
      };

      const handleVote = (rating, clickedBtn) => {
        clickedBtn.classList.add("selected");
        lockButtons();
        postFeedback({
          question: options.question || "",
          answer: options.answer || "",
          rating,
          timestamp: new Date().toISOString(),
          confidence: options.confidence || null,
          failure_bucket: options.failureBucket || null,
        });
      };

      upBtn.addEventListener("click", () => handleVote("positive", upBtn));
      downBtn.addEventListener("click", () => handleVote("negative", downBtn));

      row.appendChild(upBtn);
      row.appendChild(downBtn);
      return row;
    }

    function buildResponseFooter(options) {
      const footer = document.createElement("div");
      footer.className = "response-footer";

      if (options.failureBucket === "none" && options.confidence) {
        const confidenceEl = document.createElement("span");
        confidenceEl.className = `confidence confidence-${options.confidence}`;
        confidenceEl.innerHTML = `<span class="confidence-dot"></span>${confidenceLabelMap[options.confidence] || ""}`;
        footer.appendChild(confidenceEl);
      }

      if (typeof options.responseTimeSeconds === "number" && Number.isFinite(options.responseTimeSeconds)) {
        const timingEl = document.createElement("span");
        timingEl.textContent = `${options.responseTimeSeconds.toFixed(2)}s`;
        footer.appendChild(timingEl);
      }

      if (options.enableFeedback) {
        footer.appendChild(
          buildFeedbackControls({
            question: options.question,
            answer: options.answer,
            confidence: options.confidence,
            failureBucket: options.failureBucket,
          })
        );
      }

      return footer.childNodes.length ? footer : null;
    }

    function addMessage(role, text, options = {}) {
      const isBot = role === "bot";
      const row = document.createElement("section");
      row.className = `message ${isBot ? "bot" : "user"}`;

      const bubble = document.createElement("article");
      bubble.className = "bubble";

      const status = options.failureBucket ? statusMap[options.failureBucket] : null;
      if (status && status.bubbleClass) {
        bubble.classList.add(status.bubbleClass);
      }

      const meta = document.createElement("div");
      meta.className = "meta";
      const sender = document.createElement("span");
      sender.className = "sender";
      sender.textContent = isBot ? "Dot" : "You";
      meta.appendChild(sender);

      if (status) {
        const badge = document.createElement("span");
        badge.className = `badge ${status.badgeClass}`;
        badge.textContent = status.label;
        meta.appendChild(badge);
      }

      const body = document.createElement("div");
      body.className = "bubble-body";
      body.textContent = text;

      bubble.appendChild(meta);
      bubble.appendChild(body);

      if (isBot && options.failureBucket === "conflict_in_sources") {
        const conflictView = buildConflictView(options.conflictDetails);
        if (conflictView) {
          bubble.appendChild(conflictView);
        }
      }

      if (
        isBot &&
        options.failureBucket === "not_in_sources" &&
        Array.isArray(options.suggestions) &&
        options.suggestions.length > 0
      ) {
        bubble.appendChild(buildSuggestions(options.suggestions));
      }

      if (
        options.failureBucket !== "not_in_sources" &&
        Array.isArray(options.citations) &&
        options.citations.length > 0
      ) {
        bubble.appendChild(buildCitations(options.citations));
      }

      if (isBot) {
        const footer = buildResponseFooter(options);
        if (footer) {
          bubble.appendChild(footer);
        }
      }

      row.appendChild(bubble);
      chatLogEl.appendChild(row);
      autoScroll();
      return row;
    }

    function addLoadingMessage() {
      const row = document.createElement("section");
      row.className = "message bot";
      row.id = "loading-row";

      const bubble = document.createElement("article");
      bubble.className = "bubble";

      bubble.innerHTML = `
        <div class="meta">
          <span class="sender">Dot</span>
        </div>
        <div class="bubble-body"><span class="loading-dots"><span></span><span></span><span></span></span></div>
      `;

      row.appendChild(bubble);
      chatLogEl.appendChild(row);
      autoScroll();
    }

    function removeLoadingMessage() {
      const row = document.getElementById("loading-row");
      if (row) row.remove();
    }

    function setSending(isSending) {
      sendBtnEl.disabled = isSending;
      inputEl.disabled = isSending;
      clearBtnEl.disabled = isSending;
    }

    async function loadModeBadge() {
      modeBadgeEl.textContent = "...";
      modeBadgeEl.classList.remove("mode-llm", "mode-offline");
      try {
        const response = await fetch("/health");
        const data = await response.json();
        const mode = data.mode;
        if (mode === "llm") {
          modeBadgeEl.textContent = "LLM";
          modeBadgeEl.classList.add("mode-llm");
        } else {
          modeBadgeEl.textContent = "Offline";
          modeBadgeEl.classList.add("mode-offline");
        }
      } catch {
        modeBadgeEl.textContent = "Offline";
        modeBadgeEl.classList.add("mode-offline");
      }
    }

    async function sendQuestion(questionOverride = null) {
      const question = (questionOverride || inputEl.value).trim();
      if (!question) return;

      addMessage("user", question);
      if (!questionOverride) {
        inputEl.value = "";
        inputEl.style.height = "auto";
      }

      const historyPayload = conversationHistory.slice();
      setSending(true);
      addLoadingMessage();

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question,
            history: historyPayload,
          }),
        });

        const data = await response.json();
        removeLoadingMessage();
        const answerText = data.answer || "No response available.";

        addMessage("bot", answerText, {
          citations: data.citations,
          failureBucket: data.failure_bucket,
          conflictDetails: data.conflict_details,
          suggestions: data.suggestions,
          confidence: data.confidence,
          responseTimeSeconds: data.response_time_seconds,
          enableFeedback: true,
          question,
          answer: answerText,
        });

        conversationHistory.push({ role: "user", content: question });
        conversationHistory.push({ role: "assistant", content: answerText });
      } catch (error) {
        removeLoadingMessage();
        const fallbackMessage = "I hit a temporary issue while answering. I'd recommend reaching out to our support team for clarification.";
        addMessage(
          "bot",
          fallbackMessage,
          {
            failureBucket: "retrieval_failed",
            responseTimeSeconds: null,
            enableFeedback: true,
            question,
            answer: fallbackMessage,
            confidence: "low",
          }
        );
        console.error(error);
      } finally {
        setSending(false);
        inputEl.focus();
      }
    }

    clearBtnEl.addEventListener("click", () => {
      chatLogEl.innerHTML = "";
      conversationHistory = [];
      addMessage("bot", "Hey! I'm Dot, Loomo's policy expert. Ask me anything about our policies and I'll find the answer in our docs. 👋");
      inputEl.focus();
    });

    formEl.addEventListener("submit", (event) => {
      event.preventDefault();
      sendQuestion();
    });

    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendQuestion();
      }
    });

    loadModeBadge();
    addMessage("bot", "Hey! I'm Dot, Loomo's policy expert. Ask me anything about our policies and I'll find the answer in our docs. 👋");
    inputEl.focus();
  </script>
</body>
</html>
